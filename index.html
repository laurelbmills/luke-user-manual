<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luke User Manual</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;background:white;font-family:Arial,sans-serif}
.icon{width:28px;height:28px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P={primary:"#498B6D",secondary:"#33576E",pale:"#EEF6EF"};
let tab="feeding";
let openResource=null;

const bottleSchedule=[
["6:30 to 7:30 am","First bottle, add 1 syringe full of vitamin"],
["11:00 am","Second bottle"],
["3:00 pm","Third bottle"],
["6:30 to 7:00 pm","Final bottle, turn on the sound machine before feeding him. You can leave it running all night using the clock button on the side and it may need daily charging."]
];

const napSchedule=[
["9:00 to 10:00 am","Usually goes down sometime during this window for his morning nap"],
["1:00 to 2:00 pm","Usually goes down sometime during this window for his afternoon nap"]
];

const resources=[
["Pediatrician",["Ryan Wilcox","1159 E 200 N Dr #200, American Fork, UT 84003","(801) 756-5290"],"phone"],
["Daycare",["69 N 300 W Lehi, UT","Cari Harris Cell: 801-830-5772","You can text or call"],"building"],
["Medicine",["Tylenol or cough syrup as needed","Follow recommendations on the bottle"],"bottle"],
["Car Seat Tips",["Make sure the harness straps are at or below his shoulders.","The chest clip should sit at armpit level.","The seat should not move more than 1 inch once installed.","Use the release button near the pull strap to loosen the harness.","Tighten the pull strap again before driving anywhere."],"book"],
["Things Luke Is Currently Loving",["Helping unload the dishwasher","Opening and closing doors and drawers","Fans","Ms. Rachel on Netflix or YouTube"],"heart"]
];

function icon(type){
 if(type==="sleeping")return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22.5 24.5A10.5 10.5 0 0 1 8 10a9 9 0 1 0 14.5 14.5Z"/><path d="M22 7l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2Z"/></svg>`;
 if(type==="resources"||type==="book")return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 7h9a4 4 0 0 1 4 4v16a4 4 0 0 0-4-4H6V7Z"/><path d="M26 7h-7a4 4 0 0 0-4 4v16a4 4 0 0 1 4-4h7V7Z"/></svg>`;
 if(type==="phone")return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="10" y="4" width="12" height="24" rx="3"/><path d="M14 24h4"/></svg>`;
 if(type==="building")return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 28V8h18v20"/><path d="M11 12h3M18 12h3M11 17h3M18 17h3M11 22h3M18 22h3"/></svg>`;
 if(type==="heart")return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 27s-9-5.6-9-13a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 7.4-9 13-9 13Z"/></svg>`;
 return `<svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 3h6"/><path d="M14 3v5l-3 3v15c0 2 1.5 3 5 3s5-1 5-3V11l-3-3V3"/><path d="M12 16h8"/></svg>`;
}

function schedule(items){
 return `<div class="rounded-2xl border p-5 bg-white"><div class="space-y-5">${items.map(([time,note])=>`<div class="border-l-2 pl-5" style="border-color:${P.primary}"><p class="font-bold text-lg">${time}</p><p class="text-sm text-gray-700">${note}</p></div>`).join("")}</div></div>`;
}
function reminder(){return `<div class="rounded-2xl border p-4" style="background:${P.pale}"><p class="text-sm leading-6"><b>Reminder:</b> Luke had his MMR vaccine and may show a fever around Monday.</p><p class="text-sm leading-6 mt-3">If his cold/cough is not completely cleared up by Wednesday, call the pediatrician about antibiotics. The office number is under the Resources tab.</p></div>`}
function info(label,text){return `<div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200"><p class="mb-1 text-xs font-bold uppercase tracking-wide" style="color:${P.primary}">${label}</p><p class="text-sm leading-6 text-gray-700">${text}</p></div>`}
function title(t){return `<h2 class="text-2xl font-bold" style="color:${P.primary}">${t}</h2>`}
function sub(t){return `<h3 class="font-bold mb-3" style="color:${P.primary}">${t}</h3>`}
function card(content,green=false){return `<div class="rounded-2xl border p-5 ${green?'':'bg-white'}" style="${green?'background:'+P.pale:''}">${content}</div>`}

function feeding(){
 return `<div class="space-y-5">${title("Feeding")}
 ${card(`<div class="flex items-center gap-4" style="color:${P.primary}">${icon("feeding")}<p class="font-semibold text-gray-900">Luke takes 4 bottles per day, each 6 to 8 oz.</p></div>`,true)}
 <div>${sub("Typical Schedule")}${schedule(bottleSchedule)}</div>
 ${card(`<p class="text-sm text-gray-700">Sometimes he takes a little break, then comes back to finish once he is done being distracted.</p>`,true)}
 <div>${sub("Formula Prep")}${card(`<p class="text-sm text-gray-700">Use this ratio: 1 scoop = 1 oz water.</p>`)}</div>
 <div>${sub("Solids and Snacks")}${card(`<ul class="space-y-2 text-sm text-gray-700"><li>• You can give baby food, puffs, or soft foods throughout the day.</li><li>• No strict schedule for solids.</li><li>• Bottles are still his main source of calories.</li></ul>`)}</div>
 <div>${sub("Bottle Washing")}${card(`<p class="text-sm text-gray-700">We either hand wash the bottles or throw them in the dishwasher for cleaning.</p>`)}</div>
 </div>`;
}

function sleeping(){
 return `<div class="space-y-5">${title("Sleeping")}
 <div>${sub("Naps")}${schedule(napSchedule)}</div>
 ${card(`<div class="space-y-3">${info("Nap Routine","Follow his cues if he seems tired earlier. Give him his binky and place him in the crib awake.")}${info("Settling","He may move around for a bit before falling asleep. Only intervene if he is crying really hard.")}${info("Cues","Rubbing eyes, yawning, getting fussy.")}</div>`,true)}
 <div>${sub("Nighttime Sleep")}${card(`<div class="space-y-3">${info("Bath Time","We typically give him a bath between 6:00 and 6:30 pm before getting him ready for bed. We usually do baths nightly, but if there is a lot going on we sometimes skip it.")}${info("Bedtime Window","Luke goes down after his last bottle between 6:30 and 7:30 pm.")}${info("Bedtime Routine","After his bottle, we usually read a book or rock him for a minute, then give him his binky and place him in his crib awake.")}${info("Settling","He may move around for a little while before putting himself to sleep. We usually only intervene if he is crying really hard.")}${info("Crib Setup","Sleep sack, binky, nothing else.")}</div>`,true)}</div>
 <div>${sub("Overnight Wake Ups")}${card(`<div class="space-y-3">${info("Try First","Try putting his binky back in and give him a few minutes to settle.")}${info("If Hard Crying","Pick him up and rock until he falls asleep.")}${info("Early Morning","We only bring him into bed if it is early and we are not ready to get out of bed yet.")}</div>`,true)}</div>
 </div>`;
}

function resourcesTab(){
 return `<div class="space-y-5">${title("Resources")}
 ${resources.map(([name,items,type])=>{let open=openResource===name; return `<div class="rounded-2xl border overflow-hidden" style="background:${P.pale}"><button onclick="toggleResource('${name.replaceAll("'","\\'")}')" class="w-full p-5 text-left flex items-center gap-4" style="color:${P.primary}">${icon(type)}<span class="font-bold flex-1 text-gray-900">${name}</span><span class="text-2xl" style="color:${P.secondary}">${open?"−":"+"}</span></button>${open?`<div class="px-5 pb-5 border-t border-slate-200"><ul class="space-y-2 text-sm leading-6 text-gray-700 pt-4">${items.map(i=>`<li>• ${i}</li>`).join("")}</ul></div>`:""}</div>`}).join("")}
 </div>`;
}
window.toggleResource=function(name){openResource=openResource===name?null:name;render()}

function render(){
 let body=tab==="feeding"?feeding():tab==="sleeping"?sleeping():resourcesTab();
 document.getElementById("app").innerHTML=`<div class="min-h-screen bg-white"><div class="max-w-md mx-auto pb-28"><div class="text-white px-6 pt-10 pb-8 rounded-b-3xl" style="background:linear-gradient(135deg,${P.primary},${P.secondary})"><div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-white/15 text-white">${icon(tab)}</div><h1 class="text-3xl font-bold">Luke User Manual</h1></div><div class="p-5 space-y-6">${reminder()}${body}</div></div><div class="fixed bottom-0 left-0 right-0 bg-white border-t"><div class="max-w-md mx-auto grid grid-cols-3 p-3">${["feeding","sleeping","resources"].map(x=>`<button onclick="tab='${x}';render()" class="flex flex-col items-center gap-1 capitalize text-xs font-medium" style="color:${tab===x?P.primary:'#888'}">${icon(x)}${x}</button>`).join("")}</div></div></div>`;
}
render();
</script>
</body>
</html>
